[flake8]
exclude = docs
extend-ignore = E101,E111,E115,E117,E123,E124,E127,E128,E201,E202,E211,E221,E225,E226,E231,E251,E261,E262,E265,E266,E275,E301,E302,E303,E305,E306,E401,E402,E501,E701,E721,E722,E731,E741,W191,W291,W293,W391,F401,F403,F405,F811,F821,F841
style = numpy
check-return-types = false

[pycodestyle]
count = false
ignore = W191,W291,W293,E101,E111,E117,E123,E124,E127,E128,E201,E202,E211,E221,E225,E226,E231,E251,E261,E262,E265,E266,E275,E301,E302,E303,E305,E306,E401,E402,E501,E701,E721,E722,E731,E741,W391
max-line-length = 160
statistics = false

[aliases]
# Define setup.py command aliases here
test = pytest

[tool:pytest]
#collect_ignore = ['setup.py']
